version: '3.8'

services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: leave_app_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/leave_app_db
      SECRET_KEY: your-super-secret-key # TODO: Use a strong, randomly generated key in production
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app

volumes:
  pg_data:
